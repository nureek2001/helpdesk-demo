# Copy ONLY into an authorised product repository; do not modify the organiser target.
# Agent pinned to the published implementation. Update both refs after reviewing a new release.
name: Product security
on:
  push:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  checks: write
concurrency:
  group: product-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Product tests
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install product dependencies (no API secrets)
        run: python -m pip install -r requirements.txt
      - name: Run product tests
        env:
          PYTHONUTF8: "1"
          HELPDESK_RUNTIME: ${{ runner.temp }}\helpdesk-validation
        run: |
          python setup_local.py --keys-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python manage.py test portal --noinput
  security:
    uses: nureek2001/aiagentcheck/.github/workflows/reusable-security.yml@798ffbe640ffea5a78e307da5c4e6dea45365e2a
    with:
      agent_repository: nureek2001/aiagentcheck
      agent_ref: 798ffbe640ffea5a78e307da5c4e6dea45365e2a
      target_repository: ${{ github.repository }}
      target_ref: ${{ github.sha }}
      max_tokens: 12000000
      max_requests: 300
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  merge-gate:
    name: Security merge gate
    if: always()
    needs: [security, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require completed successful checks
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$SECURITY_RESULT" = success && test "$TEST_RESULT" = success
  delivery:
    needs: [merge-gate]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Replace with your authorised deployment steps.'
